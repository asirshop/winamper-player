name: probe-sources

# 社区源巡检机器人：每 6 小时对 sources.json 里的接口做一次真实可用性探测，
# 结果（alive 标记 + 可用源排前）自动 commit 回仓库。
# 用户在播放器里点「启用社区源」拉到的永远是最新巡检结果。

on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时（避开整点高峰）
  workflow_dispatch: {}       # 支持手动触发

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe sources
        run: python3 tools/probe_sources.py sources.json

      - name: Commit results
        run: |
          git config user.name "winamper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sources.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "probe: refresh source health ($(date -u +%F\ %H:%M) UTC)"
            git push
          fi
